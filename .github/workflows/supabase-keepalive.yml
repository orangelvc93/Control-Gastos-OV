name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto tras 7 dias sin actividad.
# Este workflow llama a diario a public.keepalive_ping() (ver supabase/schema.sql),
# que escribe una fila en la base para que cuente como actividad real.
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos VITE_SUPABASE_URL o VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          for attempt in 1 2 3; do
            status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
              "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Intento $attempt: HTTP $status $(cat response.txt)"
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then exit 0; fi
            sleep 30
          done
          echo "::error::Supabase no respondio correctamente"
          exit 1

      # GitHub desactiva los workflows programados de repos publicos tras 60 dias sin commits.
      # Volver a habilitarlo reinicia ese contador.
      - name: Mantener el workflow activo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
