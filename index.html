<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0912" />
    <meta name="description" content="Tus cuentas, ingresos, gastos y ahorros en un solo lugar." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Control de gastos</title>
    <script>
      // Tema antes del primer dibujo (mismo cálculo que src/shared/lib/theme.js) para que no parpadee.
      (function () {
        var pref = 'sistema';
        try { pref = localStorage.getItem('cg-tema') || 'sistema'; } catch (e) {}
        var light = pref === 'claro' || (pref !== 'oscuro' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#4d4845');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
